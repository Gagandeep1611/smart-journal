[project]
name = "smart-journal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gagandeep1611", email = "gagandeep161198@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "black>=26.5.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "isort>=9.0.1",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
smart-journal = "smart_journal:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
